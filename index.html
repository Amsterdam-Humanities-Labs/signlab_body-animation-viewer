<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    /* Hamburger button */
    #hamburger {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(40, 40, 40, 0.85);
      border: 1px solid #555;
      color: #eee;
      font-size: 24px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #hamburger:hover {
      background: rgba(70, 70, 70, 0.95);
    }
    #meshSelect {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      background: rgba(40, 40, 40, 0.85);
      border: 1px solid #555;
      color: #eee;
      font-family: sans-serif;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
    }
    #meshSelect:hover {
      background: rgba(70, 70, 70, 0.95);
    }

    /* Side panel */
    #sidePanel {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: rgba(25, 25, 25, 0.95);
      border-right: 1px solid #444;
      z-index: 15;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    #sidePanel.open {
      transform: translateX(0);
    }
    #panelHeader {
      padding: 14px 16px;
      font-size: 16px;
      font-weight: bold;
      color: #ddd;
      border-bottom: 1px solid #444;
      font-family: sans-serif;
    }
    #glossSearch {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #2a2a2a;
      border: none;
      border-bottom: 1px solid #444;
      color: #eee;
      font-family: sans-serif;
      font-size: 14px;
      outline: none;
    }
    #glossSearch::placeholder {
      color: #777;
    }
    #glossSearch:focus {
      background: #333;
    }
    #fileList {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .file-item {
      padding: 10px 16px;
      color: #ccc;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .file-item .file-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item .dl-btn {
      flex-shrink: 0;
      color: #777;
      font-size: 15px;
      text-decoration: none;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
    }
    .file-item .dl-btn:hover {
      color: #eee;
      background: rgba(255,255,255,0.15);
    }
    .file-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .file-item.active {
      background: rgba(80, 140, 255, 0.3);
      color: #fff;
    }
    .file-item.anim {
      color: #9d9;
      font-style: italic;
    }
    .file-item.anim::before {
      content: "\25B6 ";
    }
    .file-item.anim.vtt-yes {
      border-left: 3px solid #4a4;
      padding-left: 13px;
    }
    .file-item.anim.vtt-no {
      border-left: 3px solid #a64;
      padding-left: 13px;
    }

    /* Overlay to close panel on click outside */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
    #overlay.open {
      display: block;
    }

    /* Animation queue dock */
    /* Timeline scrubber */
    #timeline {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36px;
      background: rgba(15, 15, 15, 0.95);
      border-top: 1px solid #444;
      z-index: 20;
      display: none;
      align-items: center;
      padding: 0 12px;
      box-sizing: border-box;
      gap: 8px;
      font-family: monospace;
      font-size: 12px;
      color: #aaa;
    }
    #timeline.visible {
      display: flex;
    }
    #timelineFrame {
      flex-shrink: 0;
      min-width: 100px;
      text-align: right;
    }
    #timelineScrubber {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #333;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    #timelineScrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #9d9;
      border-radius: 50%;
      cursor: grab;
    }
    #timelineScrubber::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #9d9;
      border-radius: 50%;
      border: none;
      cursor: grab;
    }
    #timelinePlayBtn {
      flex-shrink: 0;
      background: none;
      border: 1px solid #555;
      color: #ccc;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #timelinePlayBtn:hover {
      background: rgba(255,255,255,0.1);
    }

    #animQueue {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(20, 20, 20, 0.9);
      border-top: 1px solid #444;
      z-index: 20;
      display: none;
      align-items: center;
      padding: 0 12px;
      box-sizing: border-box;
      gap: 10px;
    }
    #animQueue.visible, #animQueue.drag-target {
      display: flex;
    }
    #animQueue.drag-target {
      border-top: 2px dashed #9d9;
      justify-content: center;
    }
    #animQueue.drag-over {
      border-top: 2px solid #9d9;
      box-shadow: 0 -2px 12px rgba(153, 221, 153, 0.3);
      background: rgba(30, 40, 30, 0.95);
    }
    #queueLabel {
      color: #888;
      font-family: sans-serif;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #queueItems {
      display: flex;
      flex-direction: row;
      gap: 8px;
      overflow-x: auto;
      flex: 1;
      align-items: center;
      padding: 4px 0;
    }
    .queue-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(50, 50, 50, 0.9);
      border: 1px solid #555;
      border-radius: 16px;
      padding: 4px 10px;
      color: #9d9;
      font-family: monospace;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .queue-chip:hover {
      background: rgba(70, 70, 70, 0.9);
    }
    .queue-chip.playing {
      border-color: #9d9;
      box-shadow: 0 0 8px rgba(153, 221, 153, 0.4);
    }
    .queue-chip .chip-remove {
      color: #888;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
    }
    .queue-chip .chip-remove:hover {
      color: #f66;
    }
    .queue-chip.dragging {
      opacity: 0.4;
    }
    .queue-chip.drag-over-left {
      border-left: 2px solid #9d9;
      padding-left: 8px;
    }
    .queue-chip.drag-over-right {
      border-right: 2px solid #9d9;
      padding-right: 8px;
    }
    .file-item.anim {
      cursor: grab;
    }
    .file-item.anim.dragging {
      opacity: 0.4;
    }
    #queueName {
      background: rgba(40, 40, 40, 0.9);
      border: 1px solid #555;
      border-radius: 4px;
      color: #ccc;
      font-family: monospace;
      font-size: 12px;
      padding: 4px 8px;
      width: 180px;
      flex-shrink: 0;
      outline: none;
    }
    #queueName:focus {
      border-color: #9d9;
      color: #eee;
    }
    #savedQueuesHeader {
      padding: 10px 16px 6px;
      font-size: 13px;
      font-weight: bold;
      color: #999;
      font-family: sans-serif;
      border-top: 1px solid #444;
    }
    #savedQueuesList {
      overflow-y: auto;
      max-height: 200px;
      padding: 0 0 8px;
    }
    .saved-queue-item {
      padding: 8px 16px;
      color: #ccc;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .saved-queue-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .saved-queue-item .sq-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .saved-queue-item .sq-count {
      color: #777;
      font-size: 11px;
      flex-shrink: 0;
    }
    .saved-queue-item .sq-remove {
      color: #666;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }
    .saved-queue-item .sq-remove:hover {
      color: #f66;
    }

    /* Video panel for CNGT reference videos */
    #videoPanel {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 18;
      display: none;
      background: #000;
      border: 1px solid #555;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      max-width: 40vw;
      max-height: 60vh;
    }
    #videoPanel.visible {
      display: block;
    }
    #videoPlayer {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
    }
    #videoClose {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    #videoClose:hover {
      color: #fff;
      background: rgba(0,0,0,0.8);
    }

    /* Sentence button */
    #sentenceBtn {
      position: fixed;
      top: 12px;
      left: 60px;
      z-index: 20;
      background: rgba(40, 40, 40, 0.85);
      border: 1px solid #555;
      color: #eee;
      font-size: 20px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #sentenceBtn:hover {
      background: rgba(70, 70, 70, 0.95);
    }

    /* Sentence modal */
    #sentenceOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 50;
    }
    #sentenceOverlay.open { display: block; }
    #sentenceModal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      max-width: 90vw;
      max-height: 80vh;
      background: #222;
      border: 1px solid #444;
      border-radius: 10px;
      z-index: 51;
      flex-direction: column;
      overflow: hidden;
      font-family: sans-serif;
    }
    #sentenceModal.open { display: flex; }
    #sentenceHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #444;
      color: #eee;
      font-size: 16px;
      font-weight: bold;
      flex-shrink: 0;
    }
    #sentenceHeader .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    #sentenceHeader .close-btn:hover { color: #eee; }
    #sentenceBody {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    #sentenceInput {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 6px;
      color: #eee;
      font-size: 15px;
      outline: none;
      font-family: sans-serif;
    }
    #sentenceInput:focus { border-color: #9d9; }
    #sentenceInput::placeholder { color: #777; }
    #wordCards {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      min-height: 40px;
    }
    .word-card {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 90px;
    }
    .word-card.no-match {
      opacity: 0.5;
    }
    .word-card.segmented {
      border-color: #4a4;
    }
    .word-card.unsegmented {
      border-color: #a64;
    }
    .word-card .seg-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
    }
    .seg-dot.seg-yes { background: #4a4; }
    .seg-dot.seg-no { background: #a64; }
    .word-card .word-label {
      color: #ccc;
      font-size: 13px;
      font-weight: bold;
    }
    .word-card select {
      background: #333;
      border: 1px solid #555;
      color: #eee;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      cursor: pointer;
    }
    .word-card select:focus { border-color: #9d9; }
    .word-card .no-match-label {
      color: #888;
      font-size: 12px;
      font-style: italic;
    }
    #sentenceActions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-shrink: 0;
    }
    #sentencePlay {
      background: #2a5a2a;
      border: 1px solid #4a4;
      color: #9d9;
      font-size: 14px;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-family: sans-serif;
      font-weight: bold;
    }
    #sentencePlay:hover:not(:disabled) { background: #3a6a3a; }
    #sentencePlay:disabled { opacity: 0.4; cursor: default; }
    #sentenceStatus {
      color: #888;
      font-size: 13px;
    }
    .queue-chip.seg-chip { border-color: #4a4; }
    .queue-chip.noseg-chip { border-color: #a64; }
    #segLegend {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 22;
      background: rgba(30,30,30,0.9);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: sans-serif;
      font-size: 11px;
      color: #aaa;
      display: none;
      gap: 8px;
      align-items: center;
    }
    #segLegend.visible { display: flex; }
    #segLegend .leg-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <button id="hamburger">&#9776;</button>
  <button id="sentenceBtn" title="Zin naar Gebaar">&#9997;</button>
  <div id="sentenceOverlay"></div>
  <div id="sentenceModal">
    <div id="sentenceHeader">
      <span>Zin naar Gebaar</span>
      <button class="close-btn" id="sentenceClose">&times;</button>
    </div>
    <div id="sentenceBody">
      <input id="sentenceInput" type="text" placeholder="Typ een Nederlandse zin..." autocomplete="off">
      <div id="wordCards"></div>
      <div id="sentenceActions">
        <button id="sentencePlay" disabled>&#9654; Afspelen</button>
        <span id="sentenceStatus"></span>
      </div>
    </div>
  </div>
  <select id="meshSelect">
    <option value="lod1.glb">Default (no texture)</option>
    <option value="Meshy_AI__0217164759_texture.glb">Textured</option>
  </select>
  <div id="overlay"></div>
  <div id="sidePanel">
    <div id="panelHeader">GLB Files</div>
    <input id="glossSearch" type="text" placeholder="Search gloss...">
    <div id="fileList"></div>
    <div id="savedQueuesHeader">Saved Queues</div>
    <div id="savedQueuesList"></div>
  </div>
  <div id="videoPanel">
    <button id="videoClose">&times;</button>
    <video id="videoPlayer" muted></video>
  </div>
  <canvas id="renderCanvas"></canvas>

  <div id="timeline">
    <button id="timelinePlayBtn">&#9654;</button>
    <input id="timelineScrubber" type="range" min="0" max="1000" value="0" step="1">
    <span id="timelineFrame">0 / 0</span>
  </div>

  <div id="segLegend">
    <div class="leg-item"><span class="seg-dot seg-yes"></span> gesegmenteerd</div>
    <div class="leg-item"><span class="seg-dot seg-no"></span> niet gesegmenteerd</div>
  </div>
  <div id="animQueue">
    <div id="queueLabel">Drop animation files here</div>
    <div id="queueItems"></div>
    <input id="queueName" type="text" placeholder="Queue name...">
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);

    // Animation blending (0.5s crossfade between queue transitions)
    scene.animationPropertiesOverride = new BABYLON.AnimationPropertiesOverride();
    scene.animationPropertiesOverride.enableBlending = true;
    scene.animationPropertiesOverride.blendingSpeed = 0.033; // ~0.5s at 60fps

    // Camera
    const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 3, 5, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 0.5;
    camera.upperRadiusLimit = 50;
    camera.minZ = 0.01;
    camera.maxZ = 1000;
    camera.wheelDeltaPercentage = 0.02;

    // Lights
    const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.6;

    const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, 1), scene);
    dirLight.intensity = 0.8;
    dirLight.position = new BABYLON.Vector3(5, 10, -5);

    // Track currently loaded file
    let currentFile = null;
    let currentAnim = null;
    let baseMaterial = null; // Original material for restoring

    // Gloss name map: { "filename.glb": "GLOSS_NAME", ... }
    let glossMap = {};

    // Animation queue state
    let animQueueList = [];
    let animQueueIndex = -1;
    let queuePaused = false;
    let fileListLoaded = false; // legacy, kept for openMenu guard
    let currentQueueId = null;

    const animQueueEl = document.getElementById("animQueue");
    const queueItemsEl = document.getElementById("queueItems");

    // Queue dock drag/drop handlers
    animQueueEl.addEventListener("dragover", (e) => {
      if (e.dataTransfer.types.includes("queue-index")) {
        e.preventDefault(); // Allow reorder drops anywhere on queue bar
        return;
      }
      e.preventDefault();
      animQueueEl.classList.add("drag-over");
    });
    animQueueEl.addEventListener("dragleave", () => {
      animQueueEl.classList.remove("drag-over");
    });
    animQueueEl.addEventListener("drop", (e) => {
      if (e.dataTransfer.types.includes("queue-index")) return; // Handled by queueItemsEl
      e.preventDefault();
      animQueueEl.classList.remove("drag-over");
      const filename = e.dataTransfer.getData("text/plain");
      if (filename && isAnimFile(filename)) {
        addToQueue(filename);
      }
    });

    // Also allow dropping on the canvas area when queue is empty (acts as initial target)
    canvas.addEventListener("dragover", (e) => {
      if (e.dataTransfer.types.includes("text/plain")) {
        e.preventDefault();
      }
    });
    canvas.addEventListener("drop", (e) => {
      e.preventDefault();
      const filename = e.dataTransfer.getData("text/plain");
      if (filename && isAnimFile(filename)) {
        addToQueue(filename);
      }
    });

    function addToQueue(filename) {
      animQueueList.push(filename);
      // Resume queue playback
      queuePaused = false;
      if (animQueueList.length === 1) {
        animQueueIndex = 0;
      }
      renderQueue();
      autoSaveQueue();
      playQueue();
    }

    function removeFromQueue(index) {
      animQueueList.splice(index, 1);
      if (animQueueList.length === 0) {
        animQueueIndex = -1;
        currentQueueId = null;
        document.getElementById("queueName").value = "";
        // Stop current animation
        animEndGeneration++;
        const groups = scene.animationGroups.slice();
        for (const ag of groups) { ag.stop(); ag.dispose(); }
        currentAnim = null;
        hideVideo();
        hideTimeline();
      } else if (index < animQueueIndex) {
        animQueueIndex--;
      } else if (index === animQueueIndex) {
        // Was playing this one — play next (or wrap)
        if (animQueueIndex >= animQueueList.length) animQueueIndex = 0;
        playQueue();
      }
      renderQueue();
      autoSaveQueue();
    }

    function renderQueue() {
      queueItemsEl.innerHTML = "";
      animQueueEl.classList.toggle("visible", animQueueList.length > 0);
      if (typeof updateDockPositions === "function") updateDockPositions();
      document.getElementById("queueLabel").textContent =
        animQueueList.length > 0 ? "Animation Queue" : "Drop animation files here";
      document.getElementById("segLegend").classList.toggle("visible", animQueueList.length > 0);
      animQueueList.forEach((name, i) => {
        const chip = document.createElement("div");
        const hasSeg = !!segmentMap[name];
        chip.className = "queue-chip" + (i === animQueueIndex ? " playing" : "") + (hasSeg ? " seg-chip" : " noseg-chip");
        chip.draggable = true;
        chip.dataset.queueIndex = i;
        const dot = document.createElement("span");
        dot.className = "seg-dot " + (hasSeg ? "seg-yes" : "seg-no");
        chip.appendChild(dot);
        const label = document.createElement("span");
        label.textContent = glossMap[name] || name.replace(/_anim\.glb$/i, "");
        chip.appendChild(label);
        const remove = document.createElement("span");
        remove.className = "chip-remove";
        remove.textContent = "\u00d7";
        remove.addEventListener("click", (e) => {
          e.stopPropagation();
          removeFromQueue(i);
        });
        chip.appendChild(remove);
        chip.addEventListener("click", () => {
          animQueueIndex = i;
          queuePaused = false;
          playQueue();
          renderQueue();
        });
        // Queue reorder: only dragstart on chips
        chip.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("queue-index", String(i));
          chip.classList.add("dragging");
        });
        chip.addEventListener("dragend", () => {
          chip.classList.remove("dragging");
          clearQueueDropIndicators();
        });
        queueItemsEl.appendChild(chip);
      });
    }

    function clearQueueDropIndicators() {
      queueItemsEl.querySelectorAll(".queue-chip").forEach(c =>
        c.classList.remove("drag-over-left", "drag-over-right"));
    }

    function getQueueDropIndex(clientX) {
      const chips = [...queueItemsEl.querySelectorAll(".queue-chip")];
      for (let j = 0; j < chips.length; j++) {
        const rect = chips[j].getBoundingClientRect();
        if (clientX < rect.left + rect.width / 2) return j;
      }
      return chips.length;
    }

    // Container-level drag handlers for queue reorder
    queueItemsEl.addEventListener("dragover", (e) => {
      if (!e.dataTransfer.types.includes("queue-index")) return;
      e.preventDefault();
      clearQueueDropIndicators();
      const dropIdx = getQueueDropIndex(e.clientX);
      const chips = queueItemsEl.querySelectorAll(".queue-chip");
      if (dropIdx < chips.length) {
        chips[dropIdx].classList.add("drag-over-left");
      } else if (chips.length > 0) {
        chips[chips.length - 1].classList.add("drag-over-right");
      }
    });
    queueItemsEl.addEventListener("dragleave", (e) => {
      if (!queueItemsEl.contains(e.relatedTarget)) clearQueueDropIndicators();
    });
    queueItemsEl.addEventListener("drop", (e) => {
      if (!e.dataTransfer.types.includes("queue-index")) return;
      e.preventDefault();
      e.stopPropagation();
      clearQueueDropIndicators();
      const fromIdx = parseInt(e.dataTransfer.getData("queue-index"));
      let toIdx = getQueueDropIndex(e.clientX);
      if (fromIdx === toIdx || fromIdx + 1 === toIdx) return;
      const [item] = animQueueList.splice(fromIdx, 1);
      if (toIdx > fromIdx) toIdx--;
      animQueueList.splice(toIdx, 0, item);
      // Update playing index
      if (animQueueIndex === fromIdx) {
        animQueueIndex = toIdx;
      } else {
        if (fromIdx < animQueueIndex) animQueueIndex--;
        if (toIdx <= animQueueIndex) animQueueIndex++;
      }
      renderQueue();
      autoSaveQueue();
    });

    // --- Queue persistence ---
    function generateQueueId() {
      return Math.random().toString(36).slice(2, 8);
    }

    function getSavedQueues() {
      try { return JSON.parse(localStorage.getItem("savedQueues") || "[]"); }
      catch { return []; }
    }

    function saveQueuesToStorage(queues) {
      localStorage.setItem("savedQueues", JSON.stringify(queues));
    }

    function autoSaveQueue() {
      if (animQueueList.length === 0) return;
      if (!currentQueueId) {
        currentQueueId = generateQueueId();
        document.getElementById("queueName").value = "voorbeeldzin-" + currentQueueId;
      }
      const name = document.getElementById("queueName").value.trim() || "voorbeeldzin-" + currentQueueId;
      const queues = getSavedQueues();
      const idx = queues.findIndex(q => q.id === currentQueueId);
      const entry = { id: currentQueueId, name, items: [...animQueueList], ts: Date.now() };
      if (idx >= 0) {
        queues[idx] = entry;
      } else {
        queues.unshift(entry);
      }
      saveQueuesToStorage(queues);
      renderSavedQueues();
    }

    function loadSavedQueue(id) {
      const queues = getSavedQueues();
      const q = queues.find(q => q.id === id);
      if (!q) return;
      // Stop current
      animEndGeneration++;
      const groups = scene.animationGroups.slice();
      for (const ag of groups) { ag.stop(); ag.dispose(); }
      animQueueList = [...q.items];
      animQueueIndex = 0;
      queuePaused = false;
      currentQueueId = q.id;
      document.getElementById("queueName").value = q.name;
      renderQueue();
      playQueue();
    }

    function deleteSavedQueue(id) {
      const queues = getSavedQueues().filter(q => q.id !== id);
      saveQueuesToStorage(queues);
      if (currentQueueId === id) currentQueueId = null;
      renderSavedQueues();
    }

    function renderSavedQueues() {
      const list = document.getElementById("savedQueuesList");
      const queues = getSavedQueues();
      list.innerHTML = "";
      if (queues.length === 0) {
        list.innerHTML = '<div style="padding:8px 16px;color:#666;font-family:sans-serif;font-size:12px;">No saved queues</div>';
        return;
      }
      queues.forEach(q => {
        const div = document.createElement("div");
        div.className = "saved-queue-item";
        if (q.id === currentQueueId) div.style.background = "rgba(80, 140, 255, 0.15)";
        const nameSpan = document.createElement("span");
        nameSpan.className = "sq-name";
        nameSpan.textContent = q.name;
        const countSpan = document.createElement("span");
        countSpan.className = "sq-count";
        countSpan.textContent = q.items.length + " items";
        const removeBtn = document.createElement("span");
        removeBtn.className = "sq-remove";
        removeBtn.textContent = "\u00d7";
        removeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteSavedQueue(q.id);
        });
        div.appendChild(nameSpan);
        div.appendChild(countSpan);
        div.appendChild(removeBtn);
        div.addEventListener("click", () => loadSavedQueue(q.id));
        list.appendChild(div);
      });
    }

    // Queue name input: save on change
    document.getElementById("queueName").addEventListener("input", () => {
      if (animQueueList.length > 0) autoSaveQueue();
    });

    // Render saved queues on load
    renderSavedQueues();

    // Segment map: filename → {start, end} in seconds (populated from sense index)
    let segmentMap = {};

    async function playQueue() {
      if (queuePaused || animQueueList.length === 0 || animQueueIndex < 0) return;
      const filename = animQueueList[animQueueIndex];
      renderQueue();
      await loadAnimForQueue(filename);
    }

    let animEndGeneration = 0; // Guard against stale observer callbacks

    async function loadAnimForQueue(filename) {
      if (!currentFile) {
        console.warn("No mesh loaded — load a model first.");
        return;
      }
      // Bump generation so any pending observer callback becomes stale
      const gen = ++animEndGeneration;
      // Dispose existing animations
      const groups = scene.animationGroups.slice();
      for (const ag of groups) {
        ag.stop();
        ag.dispose();
      }
      currentAnim = filename;

      try {
        await BABYLON.SceneLoader.ImportAnimationsAsync("./s3d_files/", filename, scene, false, BABYLON.SceneLoaderAnimationGroupLoadingMode.Clean);
        if (gen !== animEndGeneration) return; // Superseded by newer call
        syncVideoToAnim(filename);
        const cngt = isCngtFile(filename);
        // Disable blending for CNGT (corpus recordings, no jitter smoothing)
        scene.animationPropertiesOverride.enableBlending = !cngt;
        // Filter out animation groups with missing targets
        for (const g of scene.animationGroups) {
          g.targetedAnimations = g.targetedAnimations.filter(ta => ta.target != null);
        }
        const playableGroups = scene.animationGroups.filter(g => g.targetedAnimations.length > 0);
        if (playableGroups.length > 0) {
          const ag = playableGroups[0];
          const fps = ag.targetedAnimations.length > 0
            ? ag.targetedAnimations[0].animation.framePerSecond : 30;
          let from, to;
          const seg = segmentMap[filename];
          if (seg) {
            // Use VTT segment timing (seconds → frames)
            from = seg.start * fps;
            to = seg.end * fps;
          } else if (cngt) {
            // CNGT: play full range
            from = ag.from;
            to = ag.to;
          } else {
            // No segment data: play full range
            from = ag.from;
            to = ag.to;
          }
          ag.start(false, 1.0, from, to); // play once
          showTimeline(from, to, ag);
          console.log("Queue playing:", filename, ag.name, `frames ${from}-${to}${seg ? " (vtt segment)" : ""}`);
          // Listen for end to advance queue
          ag.onAnimationGroupEndObservable.addOnce(() => {
            if (gen !== animEndGeneration) return; // Stale
            if (animQueueList.length === 0) return;
            animQueueIndex = (animQueueIndex + 1) % animQueueList.length;
            playQueue();
          });
        }
      } catch (err) {
        if (gen === animEndGeneration) console.error("Queue animation load error:", err);
      }
    }

    function isAnimFile(name) {
      return /_anim\.glb$/i.test(name);
    }

    // --- CNGT video panel ---
    const videoPanel = document.getElementById("videoPanel");
    const videoPlayer = document.getElementById("videoPlayer");
    document.getElementById("videoClose").addEventListener("click", () => {
      hideVideo();
    });

    function isCngtFile(name) {
      return /^CNGT/i.test(name);
    }

    function getCngtVideoUrl(animFilename) {
      // CNGT0254_S014_b_720_anim.glb → CNGT0254_S014_b_720.mp4
      if (!/^CNGT/i.test(animFilename)) return null;
      const base = animFilename.replace(/_anim\.glb$/i, "");
      return "./" + base + ".mp4";
    }

    function showVideo(url) {
      videoPlayer.src = url;
      videoPlayer.currentTime = 0;
      videoPanel.classList.add("visible");
      videoPlayer.play().catch(err => console.warn("Video play failed:", err));
      document.getElementById("meshSelect").style.right = "auto";
      document.getElementById("meshSelect").style.left = "60px";
    }

    function hideVideo() {
      videoPanel.classList.remove("visible");
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      document.getElementById("meshSelect").style.right = "12px";
      document.getElementById("meshSelect").style.left = "";
    }

    function syncVideoToAnim(animFilename) {
      const url = getCngtVideoUrl(animFilename);
      if (!url) {
        hideVideo();
        return;
      }
      // Always try to show — video may still be downloading
      showVideo(url);
    }

    // --- Menu logic ---
    const hamburger = document.getElementById("hamburger");
    const sidePanel = document.getElementById("sidePanel");
    const overlay = document.getElementById("overlay");
    const fileList = document.getElementById("fileList");

    function openMenu() {
      sidePanel.classList.add("open");
      overlay.classList.add("open");
      if (!metaLoaded) fetchMeta();
      document.getElementById("glossSearch").focus();
    }

    function closeMenu() {
      sidePanel.classList.remove("open");
      overlay.classList.remove("open");
    }

    hamburger.addEventListener("click", () => {
      if (sidePanel.classList.contains("open")) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    overlay.addEventListener("click", closeMenu);

    // VTT map: filename → [start, end] in seconds
    let vttMap = {};
    let vttSet = new Set();
    let metaLoaded = false;

    // Load glossmap + vttset once (needed for display and playback)
    async function fetchMeta() {
      if (metaLoaded) return;
      try {
        const [glossResp, vttResp] = await Promise.all([
          fetch("api.php?action=glossmap"),
          fetch("api.php?action=vttset")
        ]);
        try {
          glossMap = await glossResp.json();
        } catch (e) {
          glossMap = {};
        }
        try {
          vttMap = await vttResp.json();
          vttSet = new Set(Object.keys(vttMap));
          for (const [name, seg] of Object.entries(vttMap)) {
            segmentMap[name] = { start: seg[0], end: seg[1] };
          }
        } catch (e) {
          vttMap = {};
          vttSet = new Set();
        }
        metaLoaded = true;
      } catch (err) {
        console.error("Failed to fetch metadata:", err);
      }
    }

    // Search: server-side, debounced
    let searchAbort = null;
    let searchGeneration = 0;

    async function searchFiles(query) {
      const gen = ++searchGeneration;
      if (searchAbort) searchAbort.abort();

      if (!query || query.length < 2) {
        fileList.innerHTML = '<div style="padding:16px;color:#888;font-family:sans-serif;">Type at least 2 characters to search...</div>';
        return;
      }

      fileList.innerHTML = '<div style="padding:16px;color:#888;font-family:sans-serif;">Searching...</div>';
      searchAbort = new AbortController();

      try {
        const resp = await fetch("api.php?action=list&q=" + encodeURIComponent(query), { signal: searchAbort.signal });
        if (gen !== searchGeneration) return;
        const files = await resp.json();
        renderFileList(files);
      } catch (err) {
        if (err.name === 'AbortError') return;
        if (gen !== searchGeneration) return;
        console.error("Search error:", err);
        fileList.innerHTML = '<div style="padding:16px;color:#f66;font-family:sans-serif;">Search failed</div>';
      }
    }

    function renderFileList(files) {
      fileList.innerHTML = "";
      if (files.length === 0) {
        fileList.innerHTML = '<div style="padding:16px;color:#888;font-family:sans-serif;">No results</div>';
        return;
      }
      files.forEach(name => {
        const div = document.createElement("div");
        const anim = isAnimFile(name);
        let cls = "file-item";
        if (anim) cls += " anim";
        if (name === currentFile || name === currentAnim) cls += " active";
        if (anim) cls += vttSet.has(name) ? " vtt-yes" : " vtt-no";
        div.className = cls;
        div.dataset.filename = name;
        const label = document.createElement("span");
        label.className = "file-label";
        label.textContent = glossMap[name] || name;
        div.appendChild(label);
        const dl = document.createElement("a");
        dl.className = "dl-btn";
        dl.href = "s3d_files/" + encodeURIComponent(name);
        dl.download = name;
        dl.textContent = "\u2B73";
        dl.title = "Download " + name;
        dl.addEventListener("click", (e) => e.stopPropagation());
        div.appendChild(dl);
        if (anim) {
          div.draggable = true;
          div.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", name);
            div.classList.add("dragging");
            animQueueEl.classList.add("drag-target");
          });
          div.addEventListener("dragend", () => {
            div.classList.remove("dragging");
            animQueueEl.classList.remove("drag-target");
            animQueueEl.classList.remove("drag-over");
          });
        }
        div.addEventListener("click", () => {
          if (anim) {
            pauseQueue();
            loadAnim(name);
            updateActiveItem(name);
          } else {
            closeMenu();
            loadGlb(name);
          }
        });
        if (anim) {
          div.addEventListener("dblclick", () => addToQueue(name));
        }
        fileList.appendChild(div);
      });
    }

    let searchDebounce = null;
    document.getElementById("glossSearch").addEventListener("input", (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => searchFiles(e.target.value.trim()), 300);
    });

    function updateActiveItem(filename) {
      document.querySelectorAll("#fileList .file-item").forEach(item => {
        item.classList.toggle("active", item.dataset.filename === filename);
      });
    }

    function pauseQueue() {
      if (animQueueList.length === 0) return;
      queuePaused = true;
      // Stop ongoing queue animation so it doesn't advance
      animEndGeneration++;
      const groups = scene.animationGroups.slice();
      for (const ag of groups) { ag.stop(); ag.dispose(); }
      renderQueue();
    }

    function resumeQueue() {
      if (animQueueList.length === 0) return;
      queuePaused = false;
      if (animQueueIndex < 0) animQueueIndex = 0;
      playQueue();
    }

    function clearScene() {
      // Stop and dispose animation groups
      while (scene.animationGroups.length > 0) {
        scene.animationGroups[0].stop();
        scene.animationGroups[0].dispose();
      }
      // Dispose skeletons
      while (scene.skeletons.length > 0) {
        scene.skeletons[0].dispose();
      }
      // Dispose meshes (skip camera/light nodes)
      const toDispose = scene.meshes.slice();
      toDispose.forEach(mesh => {
        mesh.dispose(false, true);
      });
    }

    async function loadGlb(filename) {
      clearScene();
      currentFile = filename;
      currentAnim = null;
      hideVideo();
      hideTimeline();

      try {
        const meshResult = await BABYLON.SceneLoader.ImportMeshAsync("", "./s3d_files/", filename, scene);
        console.log("Loaded meshes:", meshResult.meshes.map(m => m.name));
        console.log("Skeletons:", meshResult.skeletons.length);
        meshResult.skeletons.forEach((sk, i) => {
          console.log(`  Skeleton[${i}] "${sk.name}" — ${sk.bones.length} bones:`, sk.bones.map(b => b.name));
        });

        // Compute bounding box and reframe camera
        let min = new BABYLON.Vector3(Infinity, Infinity, Infinity);
        let max = new BABYLON.Vector3(-Infinity, -Infinity, -Infinity);
        meshResult.meshes.forEach(mesh => {
          if (!mesh.getBoundingInfo) return;
          const bi = mesh.getBoundingInfo();
          const corners = [
            bi.boundingBox.minimumWorld,
            bi.boundingBox.maximumWorld
          ];
          corners.forEach(c => {
            min = BABYLON.Vector3.Minimize(min, c);
            max = BABYLON.Vector3.Maximize(max, c);
          });
        });
        const center = BABYLON.Vector3.Center(min, max);
        const extent = max.subtract(min);
        const radius = extent.length() / 2;

        camera.target = center;
        camera.radius = radius * 2.5;
        camera.alpha = Math.PI / 2;
        camera.beta = Math.PI / 3;

        console.log("Bounding box center:", center, "radius:", radius);

        // Save original material for mesh switching
        const mainMesh = meshResult.meshes.find(m => m.getTotalVertices() > 0);
        if (mainMesh) baseMaterial = mainMesh.material;

        // Auto-play first animation if any
        if (scene.animationGroups.length > 0) {
          scene.animationGroups[0].start(true);
          console.log("Playing animation:", scene.animationGroups[0].name);
        }
      } catch (err) {
        console.error("Load error:", err);
      }
    }

    async function loadAnim(filename) {
      if (!currentFile) {
        console.warn("No mesh loaded — load a model first before applying an animation.");
        return;
      }
      // Stop and dispose existing animation groups before importing new ones
      while (scene.animationGroups.length > 0) {
        scene.animationGroups[0].stop();
        scene.animationGroups[0].dispose();
      }
      currentAnim = filename;

      try {
        await BABYLON.SceneLoader.ImportAnimationsAsync("./s3d_files/", filename, scene, false, BABYLON.SceneLoaderAnimationGroupLoadingMode.Clean);
        syncVideoToAnim(filename);
        const cngt = isCngtFile(filename);
        scene.animationPropertiesOverride.enableBlending = !cngt;
        console.log("Animation groups:", scene.animationGroups.map(ag => `"${ag.name}" (${ag.targetedAnimations.length} targets)`));

        // Filter out animation groups with missing targets
        for (const ag of scene.animationGroups) {
          ag.targetedAnimations = ag.targetedAnimations.filter(ta => ta.target != null);
        }
        const playable = scene.animationGroups.filter(ag => ag.targetedAnimations.length > 0);
        if (playable.length > 0) {
          const ag = playable[0];
          const fps = ag.targetedAnimations.length > 0
            ? ag.targetedAnimations[0].animation.framePerSecond : 30;
          const seg = segmentMap[filename];
          let from, to;
          if (seg) {
            from = seg.start * fps;
            to = seg.end * fps;
          } else {
            from = ag.from;
            to = ag.to;
          }
          ag.start(true, 1.0, from, to);
          showTimeline(from, to, ag);
          console.log("Playing animation:", ag.name, seg ? "(vtt segment)" : "(full)");
        }
      } catch (err) {
        console.error("Animation load error:", err);
      }
    }

    // Mesh selector: swap materials on the base skeleton mesh
    document.getElementById("meshSelect").addEventListener("change", async (e) => {
      const meshFile = e.target.value;
      if (meshFile === "lod1.glb") {
        // Restore original material
        const mesh = scene.meshes.find(m => m.getTotalVertices() > 0);
        if (mesh && baseMaterial) mesh.material = baseMaterial;
        return;
      }
      // Load textured mesh temporarily to steal its materials
      try {
        const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./s3d_files/", meshFile, scene);
        // Find the main geometry meshes (with vertices) from each set
        const baseMesh = scene.meshes.find(m => !result.meshes.includes(m) && m.getTotalVertices() > 0);
        const texMesh = result.meshes.find(m => m.getTotalVertices() > 0);
        if (baseMesh && texMesh && texMesh.material) {
          baseMesh.material = texMesh.material;
          console.log(`Applied material "${texMesh.material.name}" from "${texMesh.name}" to "${baseMesh.name}"`);
        }
        // Dispose temporary meshes (but keep the materials we stole)
        result.meshes.forEach(m => m.dispose(false, false));
      } catch (err) {
        console.error("Failed to load textured mesh:", err);
      }
    });

    // --- Timeline scrubber ---
    const timelineEl = document.getElementById("timeline");
    const scrubber = document.getElementById("timelineScrubber");
    const frameLabel = document.getElementById("timelineFrame");
    const playBtn = document.getElementById("timelinePlayBtn");
    let timelinePaused = false;
    let tlFrom = 0, tlTo = 0; // active frame range
    let activeAnimGroup = null; // reference to the currently playing animation group

    function updateDockPositions() {
      const queueVisible = animQueueEl.classList.contains("visible") || animQueueEl.classList.contains("drag-target");
      const tlVisible = timelineEl.classList.contains("visible");
      if (queueVisible && tlVisible) {
        timelineEl.style.bottom = "60px";
      } else {
        timelineEl.style.bottom = "0";
      }
    }

    function showTimeline(from, to, ag) {
      tlFrom = from;
      tlTo = to;
      activeAnimGroup = ag || null;
      scrubber.min = Math.floor(from);
      scrubber.max = Math.ceil(to);
      scrubber.value = Math.floor(from);
      frameLabel.textContent = `${Math.floor(from)} / ${Math.ceil(to)}`;
      timelineEl.classList.add("visible");
      timelinePaused = false;
      playBtn.innerHTML = "&#9646;&#9646;"; // pause icon
      updateDockPositions();
    }

    function hideTimeline() {
      timelineEl.classList.remove("visible");
      activeAnimGroup = null;
      updateDockPositions();
    }

    function updateTimelinePosition() {
      if (!timelineEl.classList.contains("visible") || !activeAnimGroup) return;
      const ag = activeAnimGroup;
      if (!ag.animatables || ag.animatables.length === 0) return;
      const frame = ag.animatables[0].masterFrame;
      if (!timelinePaused) {
        scrubber.value = Math.round(frame);
      }
      frameLabel.textContent = `${Math.round(frame)} / ${Math.ceil(tlTo)}`;
      // Sync video to animation frame
      if (videoPanel.classList.contains("visible") && videoPlayer.duration) {
        const progress = (frame - tlFrom) / (tlTo - tlFrom);
        const targetTime = progress * videoPlayer.duration;
        // Only seek if drifted more than 0.15s to avoid constant seeking
        if (Math.abs(videoPlayer.currentTime - targetTime) > 0.15) {
          videoPlayer.currentTime = targetTime;
        }
      }
    }

    // Scrubber input: pause and seek
    let scrubbing = false;
    scrubber.addEventListener("mousedown", () => { scrubbing = true; });
    scrubber.addEventListener("touchstart", () => { scrubbing = true; });
    scrubber.addEventListener("input", () => {
      const frame = parseFloat(scrubber.value);
      if (!activeAnimGroup) return;
      // Pause animation while scrubbing
      if (!timelinePaused) {
        timelinePaused = true;
        scene.animatables.forEach(a => { a.speedRatio = 0; a.pause(); });
        scene.animationGroups.forEach(g => { g.speedRatio = 0; g.pause(); });
        playBtn.innerHTML = "&#9654;"; // play icon
      }
      activeAnimGroup.goToFrame(frame);
      frameLabel.textContent = `${Math.round(frame)} / ${Math.ceil(tlTo)}`;
      // Sync video
      if (videoPanel.classList.contains("visible") && videoPlayer.duration) {
        const progress = (frame - tlFrom) / (tlTo - tlFrom);
        videoPlayer.currentTime = progress * videoPlayer.duration;
        if (!videoPlayer.paused) videoPlayer.pause();
      }
    });
    scrubber.addEventListener("mouseup", () => { scrubbing = false; });
    scrubber.addEventListener("touchend", () => { scrubbing = false; });

    // Play/pause button
    playBtn.addEventListener("click", () => {
      console.log("Pause btn clicked, timelinePaused:", timelinePaused, "animatables:", scene.animatables.length, "groups:", scene.animationGroups.length);
      if (timelinePaused) {
        // Resume — restart animatables
        timelinePaused = false;
        scene.animatables.forEach(a => { a.speedRatio = 1; });
        scene.animationGroups.forEach(g => { g.speedRatio = 1; g.play(); });
        playBtn.innerHTML = "&#9646;&#9646;";
        if (videoPanel.classList.contains("visible")) {
          videoPlayer.play().catch(() => {});
        }
      } else {
        // Pause — freeze all animatables at scene level
        timelinePaused = true;
        scene.animatables.forEach(a => { a.speedRatio = 0; a.pause(); });
        scene.animationGroups.forEach(g => { g.speedRatio = 0; g.pause(); });
        playBtn.innerHTML = "&#9654;";
        console.log("Paused. animatables after:", scene.animatables.map(a => a.speedRatio));
        if (videoPanel.classList.contains("visible")) {
          videoPlayer.pause();
        }
      }
    });

    // --- Sentence-to-Sign ---
    let senseIndex = null;
    let senseIndexLoading = false;
    const sentenceBtnEl = document.getElementById("sentenceBtn");
    const sentenceOverlayEl = document.getElementById("sentenceOverlay");
    const sentenceModalEl = document.getElementById("sentenceModal");
    const sentenceInputEl = document.getElementById("sentenceInput");
    const wordCardsEl = document.getElementById("wordCards");
    const sentencePlayEl = document.getElementById("sentencePlay");
    const sentenceStatusEl = document.getElementById("sentenceStatus");

    async function fetchSenseIndex() {
      if (senseIndexLoading) return;
      if (senseIndex && Object.keys(senseIndex).length > 0) return;
      senseIndexLoading = true;
      try {
        const resp = await fetch("api.php?action=senseindex");
        senseIndex = await resp.json();
      } catch (err) {
        console.error("Failed to fetch sense index:", err);
        senseIndex = null;
      }
      senseIndexLoading = false;
      // Re-render if user already typed while index was loading
      if (sentenceInputEl.value.trim()) renderWordCards();
    }

    function openSentenceModal() {
      sentenceOverlayEl.classList.add("open");
      sentenceModalEl.classList.add("open");
      sentenceInputEl.focus();
      fetchSenseIndex();
    }

    function closeSentenceModal() {
      sentenceOverlayEl.classList.remove("open");
      sentenceModalEl.classList.remove("open");
    }

    sentenceBtnEl.addEventListener("click", openSentenceModal);
    sentenceOverlayEl.addEventListener("click", closeSentenceModal);
    document.getElementById("sentenceClose").addEventListener("click", closeSentenceModal);

    let sentenceDebounce = null;
    sentenceInputEl.addEventListener("input", () => {
      clearTimeout(sentenceDebounce);
      sentenceDebounce = setTimeout(renderWordCards, 300);
    });

    // Track selections: word_lowercase → selected file
    let wordSelections = {};

    function renderWordCards() {
      const text = sentenceInputEl.value.trim();
      // Save current selections before rebuilding
      wordCardsEl.querySelectorAll(".word-card:not(.no-match)").forEach(card => {
        const w = card.querySelector(".word-label").textContent.toLowerCase();
        const sel = card.querySelector("select");
        if (sel) wordSelections[w] = sel.value;
      });
      wordCardsEl.innerHTML = "";
      sentenceStatusEl.textContent = "";
      sentencePlayEl.disabled = true;
      if (!text || !senseIndex) return;

      const words = text.split(/\s+/).map(w => w.replace(/[.,!?;:'"()\[\]{}]/g, "")).filter(Boolean);
      let matched = 0;

      words.forEach(word => {
        const key = word.toLowerCase();
        let variants = senseIndex[key];
        // Filter: prefer glosses starting with the word, fall back to all
        if (variants) {
          const prefixed = variants.filter(v => v.glos.toLowerCase().startsWith(key));
          if (prefixed.length > 0) variants = prefixed;
        }
        const card = document.createElement("div");
        card.className = "word-card" + (!variants ? " no-match" : "");
        const label = document.createElement("div");
        label.className = "word-label";
        label.textContent = word;
        card.appendChild(label);

        if (variants && variants.length > 0) {
          matched++;
          const select = document.createElement("select");
          const skip = document.createElement("option");
          skip.value = "";
          skip.textContent = "- geen gebaar -";
          select.appendChild(skip);
          variants.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.file;
            opt.textContent = v.senses || v.glos;
            if (v.seg) opt.dataset.seg = JSON.stringify(v.seg);
            select.appendChild(opt);
          });
          // Restore previous selection
          if (wordSelections[key] && [...select.options].some(o => o.value === wordSelections[key])) {
            select.value = wordSelections[key];
          }
          const updateCardSeg = () => {
            const opt = select.options[select.selectedIndex];
            const hasSeg = opt && opt.dataset.seg;
            card.classList.toggle("segmented", !!hasSeg);
            card.classList.toggle("unsegmented", !!opt && !!opt.value && !hasSeg);
            dot.className = "seg-dot " + ((!opt || !opt.value) ? "" : hasSeg ? "seg-yes" : "seg-no");
          };
          select.addEventListener("change", updateCardSeg);
          card.appendChild(select);
          const dot = document.createElement("span");
          dot.className = "seg-dot";
          label.appendChild(dot);
          updateCardSeg();
        } else {
          const noMatch = document.createElement("div");
          noMatch.className = "no-match-label";
          noMatch.textContent = "geen match";
          card.appendChild(noMatch);
        }
        wordCardsEl.appendChild(card);
      });

      sentenceStatusEl.textContent = words.length > 0 ? `${matched}/${words.length} woorden gevonden` : "";
      sentencePlayEl.disabled = matched === 0;
    }

    sentencePlayEl.addEventListener("click", playSentence);

    function playSentence() {
      const cards = wordCardsEl.querySelectorAll(".word-card:not(.no-match) select");
      if (cards.length === 0) return;
      const files = [];
      cards.forEach(sel => {
        if (!sel.value) return;
        files.push(sel.value);
        const opt = sel.options[sel.selectedIndex];
        if (opt && opt.dataset.seg) {
          const s = JSON.parse(opt.dataset.seg);
          segmentMap[sel.value] = { start: s[0], end: s[1] };
        }
      });

      // Build queue from matched words
      animQueueList = files;
      animQueueIndex = 0;
      queuePaused = false;
      currentQueueId = generateQueueId();
      const name = sentenceInputEl.value.trim() || "zin-" + currentQueueId;
      document.getElementById("queueName").value = name;
      renderQueue();
      autoSaveQueue();
      closeSentenceModal();
      playQueue();
    }

    // Keyboard: Enter plays, Escape closes
    sentenceModalEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !sentencePlayEl.disabled) {
        e.preventDefault();
        playSentence();
      }
      if (e.key === "Escape") {
        e.preventDefault();
        closeSentenceModal();
      }
    });

    // Initial load: load base mesh and metadata (glossmap + vttset)
    loadGlb("lod1.glb");
    fetchMeta();

    // Render loop
    engine.runRenderLoop(() => {
      scene.render();
      updateTimelinePosition();
    });

    // Resize handler
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
